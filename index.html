<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYRA | بازی آنلاین</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d18;
 color:white;
 font-family:Tahoma,Arial,sans-serif;
}
header{
 padding:22px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#101a2c;
 border-bottom:1px solid #263c60;
}
.logo{
 font-size:27px;
 font-weight:bold;
 color:#55a5ff;
 letter-spacing:2px;
}
.vip{
 background:#1d4ed8;
 padding:10px 16px;
 border-radius:12px;
 color:white;
}
main{padding:20px;max-width:800px;margin:auto}
.welcome{
 background:linear-gradient(135deg,#142d55,#101a2c);
 padding:25px;
 border-radius:22px;
 margin-top:20px;
 border:1px solid #31558b;
}
h1{font-size:25px}
p{color:#b6c8e4;line-height:2}
h2{margin-top:35px}
.games{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}
.game{
 background:#121e32;
 border:1px solid #263e63;
 padding:22px 12px;
 border-radius:18px;
 text-align:center;
}
.icon{font-size:38px}
.game h3{margin-bottom:8px}
button{
 background:#2563eb;
 color:white;
 border:0;
 padding:12px 20px;
 border-radius:12px;
 font-size:15px;
 cursor:pointer;
}
.actions{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
 margin-top:25px;
}
.actions button{background:#172a47}
footer{
 text-align:center;
 padding:30px;
 color:#7185a5;
}
@media(max-width:400px){
 .games{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
 <div class="logo">PLAYRA</div>
 <button class="vip">⭐ خرید VIP</button>
</header>

<main>
 <section class="welcome">
  <h1>به دنیای PLAYRA خوش آمدی!</h1>
  <p>بازی کن، دوست پیدا کن و لحظات هیجان‌انگیزی بساز.</p>
  <button onclick="showMessage('به‌زودی وارد دنیای بازی می‌شوی!')">شروع بازی</button>
 </section>

 <h2>🎮 بازی‌های محبوب</h2>

 <section class="games">
  <div class="game">
   <div class="icon">🃏</div>
   <h3>حکم</h3>
   <p>بازی گروهی آنلاین</p>
   <button onclick="joinGame('حکم')">ورود</button>
  </div>

  <div class="game">
   <div class="icon">🕵️</div>
   <h3>مافیا</h3>
   <p>ویژه اعضای VIP</p>
   <button onclick="joinGame('مافیا')">ورود</button>
  </div>

  <div class="game">
   <div class="icon">🎲</div>
   <h3>تخته‌نرد</h3>
   <p>رقابت دوستانه</p>
   <button onclick="joinGame('تخته‌نرد')">ورود</button>
  </div>

  <div class="game">
   <div class="icon">📝</div>
   <h3>اسم و فامیل</h3>
   <p>سرگرمی گروهی</p>
   <button onclick="joinGame('اسم و فامیل')">ورود</button>
  </div>
 </section>

 <h2>👥 امکانات اجتماعی</h2>
 <section class="actions">
  <button onclick="showMessage('بخش دوستان به‌زودی فعال می‌شود')">دوستان</button>
  <button onclick="showMessage('بخش پیام‌ها به‌زودی فعال می‌شود')">پیام‌ها</button>
  <button onclick="showMessage('پروفایل به‌زودی فعال می‌شود')">پروفایل من</button>
  <button onclick="showMessage('فروشگاه به‌زودی فعال می‌شود')">فروشگاه</button>
 </section>
</main>

<footer>PLAYRA © 2026</footer>

<script>
function showMessage(message){
 alert(message);
}
function joinGame(name){
 if(name==="مافیا"){
  alert("این بازی مخصوص اعضای VIP است.");
 }else{
  alert("بخش "+name+" به‌زودی فعال می‌شود.");
 }
}
</script>

</body>
</html>
